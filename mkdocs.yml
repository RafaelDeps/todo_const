site_name: todo-const Documentation
site_url: https://RafaelDeps.github.io/todo_const/
theme:
  name: material
  language: en
  palette:
    scheme: default
    primary: indigo
    accent: indigo

extra:
  alternate:
    - name: English
      link: /todo_const/docs/
      lang: en
    - name: Português
      link: /todo_const/docs/pt/
      lang: pt

plugins:
  - search
  - i18n:
      default_language: en
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt
          name: Português
          build: true
          nav:
            - Home: index.pt.md
            - Project Constitution: constitution.pt.md
            - SpecKit: speckit.pt.md
            - Core Features (001):
                - Specification: project/001-todo-list-core/spec.pt.md
                - Plan: project/001-todo-list-core/plan.pt.md
                - Tasks: project/001-todo-list-core/tasks.pt.md
          nav_translations:
            Home: Início
            Project Constitution: Constituição do Projeto
            SpecKit: Metodologia SpecKit
            Core Features (001): Funcionalidades Core (001)
            Specification: Especificação
            Plan: Plano
            Tasks: Tarefas
      reconfigure_material: true
      fallback_to_default: true

nav:
  - Home: index.md
  - Project Constitution: constitution.md
  - SpecKit: speckit.md
  - Core Features (001):
      - Specification: project/001-todo-list-core/spec.md
      - Plan: project/001-todo-list-core/plan.md
      - Tasks: project/001-todo-list-core/tasks.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
