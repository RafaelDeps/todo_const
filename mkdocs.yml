site_name: todo-const Documentation
site_url: https://RafaelDeps.github.io/todo_const/
theme:
  name: material
  language: en
  palette:
    scheme: default
    primary: indigo
    accent: indigo

extra:
  alternate:
    - name: English
      link: /todo_const/
      lang: en
    - name: Português
      link: /todo_const/pt/
      lang: pt

plugins:
  - search
  - i18n:
      default_language: en
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt
          name: Português
          build: true
          nav_translations:
            Home: Início
            Project Constitution: Constituição do Projeto
            Specify: Specify
            Overview: Visão Geral
            Templates: Modelos
            Template Checklist: Checklist (Modelo)
            Template Constitution: Constituição (Modelo)
            Template Plan: Plano (Modelo)
            Template Spec: Especificação (Modelo)
            Template Tasks: Tarefas (Modelo)
      reconfigure_material: true
      fallback_to_default: true

nav:
  - Home: index.md
  - Project Constitution: constitution.md
  - Specify:
      - Overview: specify/overview.md
      - Templates:
          - Template Checklist: specify/templates/checklist.md
          - Template Constitution: specify/templates/constitution.md
          - Template Plan: specify/templates/plan.md
          - Template Spec: specify/templates/spec.md
          - Template Tasks: specify/templates/tasks.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
